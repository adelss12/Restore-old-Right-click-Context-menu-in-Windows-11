name: Publish release

# ينشر Context_Menu_Switcher.bat كإصدار كلما تغيّر، باسم رقم الإصدار المكتوب في سطر title.
on:
  push:
    branches: ["main"]
    paths: ["Context_Menu_Switcher.bat", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: |
          v=$(grep -oP '^title .* v\K[0-9.]+' Context_Menu_Switcher.bat | tr -d '\r')
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Context Menu Switcher v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: Context_Menu_Switcher.bat
          make_latest: true
          body: |
            أداة التبديل بين قائمة الزر الأيمن الكلاسيكية والحديثة في Windows 11.
            نزّل Context_Menu_Switcher.bat وانقر عليه نقرًا مزدوجًا (لا يحتاج صلاحيات المسؤول).
